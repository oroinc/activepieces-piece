name: Build the piece
description: >
  Fetch the pinned Activepieces sources, build the piece and run every check the repository has.
  Leaves the packed artifact in artifacts/ and the built bundle in packages/orocommerce/dist.

# CI and the release workflow have to run the same checks on the same inputs in the same order,
# so they share these steps rather than keeping two copies that can drift apart. The order is not
# arbitrary and is explained step by step below.

inputs:
  node-version:
    description: Node version to build with.
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # The cached tree is whatever the fetch script produced from the pin, so the key covers both.
    # Keying on the pin alone would hand a build the tree an older version of the script wrote.
    - name: Cache the upstream checkout
      uses: actions/cache@v4
      with:
        path: .ap-src
        key: ap-src-${{ hashFiles('.ap-pin', 'scripts/fetch-ap.mjs') }}

    - name: Fetch Activepieces sources
      shell: bash
      run: npm run ap:fetch

    - name: Install
      shell: bash
      run: npm ci

    - name: Lint
      shell: bash
      run: npm run lint

    # Bundle runs before the tests, not after them. check-i18n.mjs reads the built piece to learn
    # which strings the piece exposes, and test/i18n.test.ts shells out to it, so both the test
    # suite and the standalone check need dist/ to exist first.
    - name: Bundle
      shell: bash
      run: npm run bundle

    # Runs after the bundle so it also covers anything the bundler wrote. Whatever is in the
    # fetched tree is inlined into the artifact, so the tree has to stay as upstream published it.
    - name: Check the upstream tree is unmodified
      shell: bash
      run: npm run ap:check-clean

    - name: Test
      shell: bash
      run: npm test

    - name: Check translations
      shell: bash
      run: npm run i18n:check

    - name: Verify artifact
      shell: bash
      run: npm run verify

    # Most of the piece's surface comes from upstream, so a pin bump can rename a label or make a
    # field optional with nothing in this repository changing. This fails the build when that
    # happens, so the change has to be accepted in the pull request that causes it.
    - name: Check the metadata snapshot
      shell: bash
      run: npm run metadata:check
