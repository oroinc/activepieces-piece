name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetch, install, lint, bundle, check the upstream tree, test, check translations, verify the
      # artifact and check the metadata snapshot. The release workflow runs the same action, so a
      # tag build is checked exactly the way a pull request is.
      - uses: ./.github/actions/build-piece

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piece-tgz
          path: artifacts/*.tgz
          if-no-files-found: error
